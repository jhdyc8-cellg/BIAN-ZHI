<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>写作编辑器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
#app{position:relative;min-height:100vh;background:#fff;font-family:system-ui,sans-serif}
#overlay{display:none;position:fixed;inset:0;z-index:10;background:#fff;flex-direction:column}
#overlay.open{display:flex}
#overlay-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid #e0e0e0}
#overlay-label{font-size:13px;font-weight:500;color:#555}
#close-btn{background:none;border:none;cursor:pointer;color:#aaa;font-size:22px;line-height:1;padding:0 4px}
#close-btn:hover{color:#111}
#chapter-list{flex:1;overflow-y:auto;padding:8px 0}
.ch-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;font-size:15px;color:#333;border-left:2px solid transparent}
.ch-item:hover{background:#f5f5f5}
.ch-item.active{border-left-color:#111;font-weight:500;background:#f5f5f5}
.ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0 4px}
.ch-del:hover{color:#e00}
#add-ch{margin:12px 16px;padding:10px 0;font-size:14px;border:0.5px dashed #ccc;border-radius:8px;background:none;cursor:pointer;color:#888;width:calc(100% - 32px)}
#add-ch:hover{border-color:#888;color:#333}
#main{display:flex;flex-direction:column;min-height:100vh}
#topbar{display:flex;align-items:center;padding:12px 16px;border-bottom:0.5px solid #e0e0e0;gap:10px}
#menu-btn{background:none;border:none;cursor:pointer;color:#888;font-size:20px;padding:0;line-height:1}
#menu-btn:hover{color:#111}
#wordcount{font-size:12px;color:#aaa;margin-left:auto}
#writing-area{flex:1;padding:2rem 1.5rem 1.5rem}
.field{display:block;width:100%;border:none;outline:none;background:transparent;color:#111;-webkit-appearance:none;appearance:none}
#book-title-f{text-align:center;font-size:24px;font-weight:500;font-family:Georgia,serif;margin-bottom:4px}
#book-title-f::placeholder{color:#ccc}
#author-f{text-align:center;font-size:13px;color:#888;margin-bottom:1.8rem}
#author-f::placeholder{color:#ccc}
#chapter-name-f{text-align:center;font-size:17px;font-weight:500;font-family:Georgia,serif;margin-bottom:1.5rem}
#chapter-name-f::placeholder{color:#ccc}
#editor{outline:none;min-height:60vh;font-family:Georgia,serif;font-size:16px;line-height:1.95;color:#111}
#editor p{margin:0 0 0.5em;text-indent:2em}
#editor:empty:before{content:"开始写作…";color:#ccc;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="overlay">
    <div id="overlay-header">
      <span id="overlay-label">章节</span>
      <button id="close-btn" onclick="closeSidebar()">×</button>
    </div>
    <div id="chapter-list"></div>
    <button id="add-ch" onclick="addChapter()">+ 新建章节</button>
  </div>
  <div id="main">
    <div id="topbar">
      <button id="menu-btn" onclick="openSidebar()">☰</button>
      <span id="wordcount">0 字</span>
    </div>
    <div id="writing-area">
      <input id="book-title-f" class="field" placeholder="书名">
      <input id="author-f" class="field" placeholder="作者名">
      <input id="chapter-name-f" class="field" placeholder="章节名">
      <div id="editor" contenteditable="true"></div>
    </div>
  </div>
</div>
<script>
var chapters=[{name:'Chapter 1',chapterName:'Chapter 1',content:''}];
var cur=0;
function saveAll(){
  chapters[cur].content=document.getElementById('editor').innerHTML;
  chapters[cur].chapterName=document.getElementById('chapter-name-f').value;
  localStorage.setItem('nv_chapters',JSON.stringify(chapters));
  localStorage.setItem('nv_book',document.getElementById('book-title-f').value);
  localStorage.setItem('nv_author',document.getElementById('author-f').value);
}
function loadAll(){
  var s=localStorage.getItem('nv_chapters');
  if(s)chapters=JSON.parse(s);
  document.getElementById('book-title-f').value=localStorage.getItem('nv_book')||'';
  document.getElementById('author-f').value=localStorage.getItem('nv_author')||'';
  renderList();loadChapter(0);
}
function loadChapter(i){
  cur=i;
  var ch=chapters[i];
  document.getElementById('editor').innerHTML=ch.content||'';
  document.getElementById('chapter-name-f').value=ch.chapterName||ch.name;
  updateCount();renderList();
}
function renderList(){
  var list=document.getElementById('chapter-list');
  list.innerHTML='';
  chapters.forEach(function(ch,i){
    var div=document.createElement('div');
    div.className='ch-item'+(i===cur?' active':'');
    var del=chapters.length>1?'<button class="ch-del" onclick="delCh('+i+',event)">×</button>':'';
    div.innerHTML='<span class="ch-name">'+ch.name+'</span>'+del;
    div.addEventListener('click',function(){saveAll();loadChapter(i);closeSidebar();});
    list.appendChild(div);
  });
}
function addChapter(){
  saveAll();
  var n=chapters.length+1;
  chapters.push({name:'Chapter '+n,chapterName:'Chapter '+n,content:''});
  loadChapter(chapters.length-1);
}
function delCh(i,e){
  e.stopPropagation();saveAll();
  chapters.splice(i,1);
  if(cur>=chapters.length)cur=chapters.length-1;
  loadChapter(cur);
}
function openSidebar(){saveAll();renderList();document.getElementById('overlay').classList.add('open');}
function closeSidebar(){document.getElementById('overlay').classList.remove('open');}
function updateCount(){
  document.getElementById('wordcount').textContent=(document.getElementById('editor').innerText||'').replace(/\s/g,'').length+' 字';
}
var ed=document.getElementById('editor');
ed.addEventListener('input',function(){updateCount();saveAll();});
ed.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.execCommand('insertParagraph');}});
document.getElementById('chapter-name-f').addEventListener('input',saveAll);
document.getElementById('book-title-f').addEventListener('input',saveAll);
document.getElementById('author-f').addEventListener('input',saveAll);
loadAll();
</script>
</body>
</html>
